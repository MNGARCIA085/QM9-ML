[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qm9_ml"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "torch>=2.0",
  "torch-geometric>=2.5",
  "numpy>=1.23",
  "mlflow>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
